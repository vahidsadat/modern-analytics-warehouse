version: 2

models:
  - name: int_order_items_enriched
    columns:
      - name: order_item_id
        tests:
          - unique
          - not_null
      - name: order_id
        tests:
          - not_null
      - name: product_id
        tests:
          - not_null
      - name: customer_id
        tests:
          - not_null
      - name: net_revenue
        tests:
          - not_null
      - name: gross_margin
        tests:
          - not_null

  - name: int_order_enriched
    description: "Order-level model with revenue, payment, cost, margin, and status flags. One row per order."
    columns:
      - name: order_id
        tests:
          - unique
          - not_null
      - name: customer_id
        tests:
          - not_null
      - name: order_date
        tests:
          - not_null
      - name: gross_revenue
        description: "Total revenue before discounts."
        tests:
          - not_null

      - name: discount_amount
        description: "Total discount amount for the order."
        tests:
          - not_null

      - name: net_revenue
        description: "Revenue after discounts."
        tests:
          - not_null

      - name: total_cost
        description: "Total product cost for the order."
        tests:
          - not_null

      - name: gross_margin
        description: "Net revenue minus total cost."
        tests:
          - not_null

  - name: int_order_enriched
    columns:
      - name: customer_id
        tests:
          - unique
          - not_null
      
     


  
    